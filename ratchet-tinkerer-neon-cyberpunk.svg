<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Tinkerer Octocat — Ratchet, Neon Cyberpunk</title>
  <desc id="desc">An Octocat styled after Ratchet the Lombax: goggles pushed up on the forehead, striped ears, a tool belt, and a giant wrench carried as a staff, lit by cyan and magenta neon against a deep indigo night.</desc>

  <!--
    PALETTE
      void        #05060F   deep space / vignette
      indigo deep #0B0B2B   backdrop base
      indigo mid  #241A66   backdrop bloom
      cyan        #22E8FF   key neon / rim light left
      magenta     #FF2FD0   fill neon / rim light right
      yellow      #FFE24A   electric accent (bolts, buckle, sparks)
      fur light   #F5CB77   Lombax fur highlight
      fur mid     #E0A344   Lombax fur base
      fur deep    #A96B22   Lombax fur shadow / back tentacles
      stripe      #7A3E12   ear + brow stripes
      trim        #140F33   straps, frames, outlines
  -->

  <defs>
    <radialGradient id="skyGrad" cx="47%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#2A1C74"/>
      <stop offset="45%" stop-color="#14103F"/>
      <stop offset="100%" stop-color="#05060F"/>
    </radialGradient>

    <linearGradient id="horizonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22E8FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22E8FF" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#FF2FD0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2FD0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="furGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#F7D489"/>
      <stop offset="52%" stop-color="#E0A344"/>
      <stop offset="100%" stop-color="#B87A28"/>
    </linearGradient>

    <linearGradient id="furBackGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#B07728"/>
      <stop offset="100%" stop-color="#7E4E18"/>
    </linearGradient>

    <linearGradient id="furLimbGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#EFC272"/>
      <stop offset="100%" stop-color="#B87A28"/>
    </linearGradient>

    <radialGradient id="lensGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#BFFBFF"/>
      <stop offset="40%" stop-color="#22E8FF"/>
      <stop offset="100%" stop-color="#0B4A72"/>
    </radialGradient>

    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B4670"/>
      <stop offset="26%" stop-color="#C8D6F2"/>
      <stop offset="54%" stop-color="#7C8CB4"/>
      <stop offset="100%" stop-color="#242A45"/>
    </linearGradient>

    <linearGradient id="steelHeadGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#E4EDFF"/>
      <stop offset="34%" stop-color="#9CACD4"/>
      <stop offset="70%" stop-color="#5C688F"/>
      <stop offset="100%" stop-color="#242A45"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFF6B8"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>

    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22E8FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22E8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- mirrors the #body-blob outline so the neon washes stay inside the silhouette -->
    <clipPath id="bodyClip">
      <path d="M470,228 C566,228 648,296 648,392 C648,462 630,516 596,552 C560,590 380,590 344,552 C310,516 292,462 292,392 C292,296 374,228 470,228 Z"/>
    </clipPath>

    <filter id="glowSm" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowMd" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowLg" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============================ BACKDROP ============================ -->
  <g id="backdrop">
    <rect x="0" y="0" width="1000" height="1000" fill="url(#skyGrad)"/>

    <!-- distant skyline -->
    <g id="skyline" fill="#0C0A2C">
      <rect x="0" y="470" width="58" height="130"/>
      <rect x="62" y="516" width="40" height="84"/>
      <rect x="106" y="440" width="66" height="160"/>
      <rect x="176" y="504" width="34" height="96"/>
      <rect x="214" y="478" width="52" height="122"/>
      <rect x="268" y="530" width="30" height="70"/>
      <rect x="742" y="522" width="36" height="78"/>
      <rect x="782" y="452" width="60" height="148"/>
      <rect x="846" y="500" width="38" height="100"/>
      <rect x="888" y="430" width="64" height="170"/>
      <rect x="956" y="512" width="44" height="88"/>
    </g>
    <g id="skyline-windows" fill="#22E8FF" opacity="0.5">
      <rect x="118" y="456" width="8" height="10"/>
      <rect x="136" y="456" width="8" height="10"/>
      <rect x="118" y="482" width="8" height="10"/>
      <rect x="150" y="482" width="8" height="10"/>
      <rect x="226" y="496" width="8" height="10"/>
      <rect x="244" y="514" width="8" height="10"/>
      <rect x="796" y="470" width="8" height="10"/>
      <rect x="820" y="470" width="8" height="10"/>
      <rect x="796" y="498" width="8" height="10"/>
      <rect x="900" y="448" width="8" height="10"/>
      <rect x="924" y="448" width="8" height="10"/>
      <rect x="900" y="478" width="8" height="10"/>
    </g>
    <g id="skyline-antennae">
      <path d="M139,440 L139,400" stroke="#FF2FD0" stroke-width="3" fill="none" opacity="0.7"/>
      <path d="M920,430 L920,384" stroke="#FF2FD0" stroke-width="3" fill="none" opacity="0.7"/>
      <circle cx="139" cy="396" r="5" fill="#FF2FD0" filter="url(#glowSm)"/>
      <circle cx="920" cy="380" r="5" fill="#FF2FD0" filter="url(#glowSm)"/>
    </g>

    <!-- horizon bar -->
    <rect x="0" y="596" width="1000" height="4" fill="url(#horizonGrad)" filter="url(#glowMd)"/>

    <!-- perspective floor grid, vanishing point at 500,596 -->
    <g id="grid" stroke="#22E8FF" fill="none" stroke-width="2" opacity="0.28">
      <path d="M500,596 L-520,1000"/>
      <path d="M500,596 L-220,1000"/>
      <path d="M500,596 L20,1000"/>
      <path d="M500,596 L230,1000"/>
      <path d="M500,596 L400,1000"/>
      <path d="M500,596 L500,1000"/>
      <path d="M500,596 L600,1000"/>
      <path d="M500,596 L770,1000"/>
      <path d="M500,596 L980,1000"/>
      <path d="M500,596 L1220,1000"/>
      <path d="M500,596 L1520,1000"/>
      <path d="M0,622 L1000,622" opacity="0.4"/>
      <path d="M0,640 L1000,640" opacity="0.5"/>
      <path d="M0,664 L1000,664" opacity="0.6"/>
      <path d="M0,696 L1000,696" opacity="0.7"/>
      <path d="M0,738 L1000,738" opacity="0.8"/>
      <path d="M0,794 L1000,794" opacity="0.85"/>
      <path d="M0,868 L1000,868" opacity="0.9"/>
      <path d="M0,964 L1000,964"/>
    </g>

    <!-- neon ring behind the character -->
    <g id="halo" fill="none">
      <circle cx="470" cy="398" r="286" stroke="#FF2FD0" stroke-width="6" opacity="0.45" filter="url(#glowMd)"/>
      <circle cx="470" cy="398" r="312" stroke="#22E8FF" stroke-width="3" opacity="0.35" stroke-dasharray="34 22" filter="url(#glowSm)"/>
    </g>

    <!-- floor bloom under the character -->
    <ellipse cx="470" cy="874" rx="290" ry="52" fill="url(#floorGlow)"/>
  </g>

  <!-- ============================ CHARACTER ============================ -->
  <g id="character">

    <!-- back tentacles: two wide sweeps that read as arms behind the body -->
    <g id="tentacles-back" fill="url(#furBackGrad)">
      <path id="tent-back-left" d="M330,424 C238,458 168,540 154,644 C150,676 194,684 200,652 C214,570 268,506 366,486 Z"/>
      <path id="tent-back-right" d="M598,422 C694,448 770,528 792,632 C798,662 754,672 746,640 C726,562 664,504 570,488 Z"/>
    </g>

    <!-- giant wrench carried as a staff -->
    <g id="wrench-staff" transform="translate(736,556) rotate(8)">
      <!-- shaft -->
      <rect x="-16" y="-306" width="32" height="656" rx="16" fill="url(#steelGrad)"/>
      <rect x="-16" y="-306" width="8" height="656" rx="4" fill="#EAF3FF" opacity="0.5"/>
      <path d="M16,-306 L16,344" stroke="#FF2FD0" stroke-width="4" fill="none" opacity="0.7" filter="url(#glowSm)"/>

      <!-- grip wrap where the tentacle holds it -->
      <g id="grip-wrap">
        <rect x="-22" y="10" width="44" height="160" rx="14" fill="#140F33"/>
        <path d="M-22,40 L22,28 M-22,76 L22,64 M-22,112 L22,100 M-22,148 L22,136" stroke="#22E8FF" stroke-width="4" opacity="0.85" fill="none"/>
      </g>

      <!-- butt cap with a pilot light -->
      <rect x="-24" y="322" width="48" height="34" rx="14" fill="#2E3552"/>
      <circle cx="0" cy="339" r="9" fill="#FFE24A" filter="url(#glowSm)"/>

      <!-- open-end head, canted off the shaft like a real wrench -->
      <g id="wrench-head" transform="rotate(-14 0 -300)">
        <rect x="-26" y="-300" width="52" height="36" rx="10" fill="#2E3552"/>
        <path d="M-16,-272
                 C-44,-278 -58,-296 -60,-322
                 L-64,-430
                 C-66,-452 -58,-466 -40,-470
                 C-30,-474 -26,-470 -26,-458
                 L-26,-386
                 C-26,-374 -20,-368 -8,-368
                 L8,-368
                 C20,-368 26,-374 26,-386
                 L26,-458
                 C26,-470 30,-474 40,-470
                 C58,-466 66,-452 64,-430
                 L60,-322
                 C58,-296 44,-278 16,-272 Z"
              fill="url(#steelHeadGrad)"/>
        <path d="M-52,-436 L-50,-340 M52,-436 L50,-340" stroke="#EAF3FF" stroke-width="5" fill="none" opacity="0.3"/>
        <path d="M-26,-386 C-26,-374 -20,-368 -8,-368 L8,-368 C20,-368 26,-374 26,-386" stroke="#242A45" stroke-width="5" fill="none" opacity="0.45"/>

        <!-- bolt caught in the jaw -->
        <polygon points="25,-420 12.5,-398 -12.5,-398 -25,-420 -12.5,-442 12.5,-442" fill="url(#boltGrad)" filter="url(#glowMd)"/>
        <circle cx="0" cy="-420" r="8" fill="#7A3E12" opacity="0.8"/>

        <!-- head rim lights -->
        <path d="M-40,-470 C-58,-466 -66,-452 -64,-430 L-60,-322" stroke="#22E8FF" stroke-width="5" fill="none" opacity="0.9" filter="url(#glowSm)"/>
        <path d="M40,-470 C58,-466 66,-452 64,-430 L60,-322" stroke="#FF2FD0" stroke-width="5" fill="none" opacity="0.9" filter="url(#glowSm)"/>
      </g>
    </g>

    <!-- head and body -->
    <g id="body">
      <g id="ears">
        <path d="M356,268 C332,206 306,150 300,112 C338,140 396,206 420,258 Z" fill="#C98C34"/>
        <path d="M356,268 C340,224 322,182 314,150 C344,178 388,222 406,256 Z" fill="#7A3E12"/>
        <path d="M584,264 C610,202 638,146 646,108 C608,138 552,204 530,256 Z" fill="#C98C34"/>
        <path d="M584,264 C602,220 620,178 630,146 C600,176 558,220 542,254 Z" fill="#7A3E12"/>
      </g>

      <path id="body-blob" d="M470,228 C566,228 648,296 648,392 C648,462 630,516 596,552 C560,590 380,590 344,552 C310,516 292,462 292,392 C292,296 374,228 470,228 Z" fill="url(#furGrad)"/>

      <!-- neon key/fill light bounced onto the fur -->
      <g id="body-light" clip-path="url(#bodyClip)">
        <ellipse cx="272" cy="308" rx="120" ry="165" fill="#22E8FF" opacity="0.16"/>
        <ellipse cx="678" cy="470" rx="130" ry="185" fill="#FF2FD0" opacity="0.2"/>
        <ellipse cx="470" cy="648" rx="230" ry="95" fill="#140F33" opacity="0.16"/>
      </g>

      <g id="stripes" fill="#7A3E12" opacity="0.85">
        <path d="M330,352 C348,338 372,332 392,336 C374,348 352,360 334,376 Z"/>
        <path d="M340,404 C358,394 380,390 396,394 C380,404 362,414 346,428 Z"/>
        <path d="M610,348 C592,334 568,328 548,332 C566,344 588,356 606,372 Z"/>
        <path d="M600,400 C582,390 560,386 544,390 C560,400 578,410 594,424 Z"/>
      </g>

      <path d="M298,438 C288,378 300,300 352,254" stroke="#22E8FF" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#glowMd)"/>
      <path d="M642,438 C652,378 640,300 588,252" stroke="#FF2FD0" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#glowMd)"/>

      <g id="face">
        <ellipse cx="412" cy="412" rx="45" ry="49" fill="#F2FBFF"/>
        <ellipse cx="532" cy="412" rx="45" ry="49" fill="#F2FBFF"/>
        <circle cx="418" cy="416" r="27" fill="#3CF2C8" filter="url(#glowSm)"/>
        <circle cx="538" cy="416" r="27" fill="#3CF2C8" filter="url(#glowSm)"/>
        <circle cx="418" cy="416" r="15" fill="#0B0B2B"/>
        <circle cx="538" cy="416" r="15" fill="#0B0B2B"/>
        <circle cx="410" cy="406" r="6" fill="#FFFFFF"/>
        <circle cx="530" cy="406" r="6" fill="#FFFFFF"/>

        <ellipse cx="336" cy="462" rx="26" ry="14" fill="#FF2FD0" opacity="0.3"/>
        <ellipse cx="604" cy="462" rx="26" ry="14" fill="#FF2FD0" opacity="0.3"/>

        <path d="M458,466 L482,466 L470,480 Z" fill="#FF6FA8"/>
        <path d="M470,480 L470,490" stroke="#7A3E12" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M436,490 C450,510 490,510 504,490" stroke="#7A3E12" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M456,500 L462,514 L468,500 Z" fill="#F2FBFF"/>

        <g id="whisker-sparks" stroke="#22E8FF" stroke-width="3" opacity="0.6" fill="none" stroke-linecap="round">
          <path d="M320,470 L268,462"/>
          <path d="M320,486 L272,492"/>
          <path d="M620,470 L672,462"/>
          <path d="M620,486 L668,492"/>
        </g>
      </g>

      <g id="goggles">
        <path d="M312,332 C340,258 600,258 628,332" stroke="#140F33" stroke-width="30" fill="none" stroke-linecap="round"/>
        <path d="M318,326 C346,262 594,262 622,326" stroke="#FF2FD0" stroke-width="4" fill="none" opacity="0.75" filter="url(#glowSm)"/>
        <rect x="424" y="272" width="92" height="22" rx="10" fill="#2E3552"/>
        <g id="goggle-lenses">
          <circle cx="392" cy="290" r="52" fill="#140F33"/>
          <circle cx="548" cy="290" r="52" fill="#140F33"/>
          <circle cx="392" cy="290" r="40" fill="url(#lensGrad)"/>
          <circle cx="548" cy="290" r="40" fill="url(#lensGrad)"/>
          <path d="M370,268 C382,256 402,254 414,262" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75"/>
          <path d="M526,268 C538,256 558,254 570,262" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75"/>
          <circle cx="392" cy="290" r="46" fill="none" stroke="#22E8FF" stroke-width="4" opacity="0.9" filter="url(#glowSm)"/>
          <circle cx="548" cy="290" r="46" fill="none" stroke="#22E8FF" stroke-width="4" opacity="0.9" filter="url(#glowSm)"/>
        </g>
      </g>
    </g>

    <!-- front tentacles: thick at the root, tapering, two of them curling -->
    <g id="tentacles-front" fill="url(#furLimbGrad)">
      <path id="tent-1" d="M312,478 C232,506 168,570 164,652 C160,708 222,730 250,694 C264,676 244,656 230,668 C216,680 200,668 204,642 C214,580 272,540 358,530 Z"/>
      <path id="tent-2" d="M368,528 C334,606 306,700 288,780 C282,808 330,816 336,788 C352,706 388,626 428,556 Z"/>
      <path id="tent-3" d="M436,552 C424,646 418,752 428,834 C430,860 476,858 476,832 C468,750 476,644 490,554 Z"/>
      <path id="tent-4" d="M504,552 C536,632 582,714 618,790 C630,814 674,796 664,772 C626,698 578,620 554,546 Z"/>
      <path id="tent-5" d="M576,494 C654,506 706,548 726,600 C736,626 694,640 684,614 C668,572 632,548 570,540 Z"/>
    </g>

    <g id="tentacle-rims" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M312,478 C232,506 168,570 164,652" stroke="#22E8FF" stroke-width="6" filter="url(#glowSm)"/>
      <path d="M368,528 C334,606 306,700 288,780" stroke="#22E8FF" stroke-width="5" filter="url(#glowSm)"/>
      <path d="M436,552 C424,646 418,752 428,834" stroke="#22E8FF" stroke-width="4" opacity="0.5" filter="url(#glowSm)"/>
      <path d="M554,546 C578,620 626,698 664,772" stroke="#FF2FD0" stroke-width="5" filter="url(#glowSm)"/>
      <path d="M570,540 C632,548 668,572 684,614" stroke="#FF2FD0" stroke-width="5" filter="url(#glowSm)"/>
    </g>

    <!-- gripping tentacle wraps in front of the shaft -->
    <g id="staff-grip" transform="translate(714,608) rotate(-20)">
      <path d="M-46,-32 C6,-48 50,-38 54,-6 C58,28 12,44 -34,32 C-56,26 -60,-26 -46,-32 Z" fill="url(#furLimbGrad)"/>
      <path d="M-44,-30 C4,-46 48,-36 52,-6" stroke="#22E8FF" stroke-width="4" fill="none" opacity="0.85" filter="url(#glowSm)"/>
      <path d="M-10,-38 L-6,36 M18,-36 L22,30" stroke="#B87A28" stroke-width="4" fill="none" opacity="0.8"/>
    </g>

    <!-- tool belt sits over the tentacle roots -->
    <g id="tool-belt">
      <path d="M312,498 C368,566 572,566 628,498" stroke="#140F33" stroke-width="36" fill="none" stroke-linecap="round"/>
      <path d="M316,506 C370,570 570,570 624,506" stroke="#22E8FF" stroke-width="3" fill="none" opacity="0.6" filter="url(#glowSm)"/>
      <rect x="438" y="534" width="64" height="46" rx="10" fill="#FFE24A" filter="url(#glowSm)"/>
      <polygon points="484,557 476,571 456,571 448,557 456,543 476,543" fill="#7A3E12" opacity="0.7"/>
      <!-- pouch, spare bolts, spanner on a loop -->
      <path d="M344,506 L392,530 L382,572 L336,546 Z" fill="#2E3552"/>
      <path d="M344,506 L392,530 L390,542 L342,518 Z" fill="#4A5680"/>
      <circle cx="546" cy="552" r="13" fill="#FFE24A" opacity="0.9"/>
      <circle cx="578" cy="534" r="10" fill="#22E8FF" opacity="0.9" filter="url(#glowSm)"/>
      <g id="belt-spanner" transform="translate(600,556) rotate(32)">
        <rect x="-5" y="-6" width="10" height="54" rx="4" fill="#9CACD4"/>
        <path d="M-13,-10 L-13,-26 L-5,-26 L-5,-16 L5,-16 L5,-26 L13,-26 L13,-10 C13,-2 6,4 0,4 C-6,4 -13,-2 -13,-10 Z" fill="#C8D6F2"/>
      </g>
    </g>
  </g>

  <!-- ============================ FOREGROUND ============================ -->
  <g id="foreground">
    <g id="loose-bolt" transform="translate(196,588)">
      <polygon points="26,0 13,22 -13,22 -26,0 -13,-22 13,-22" fill="url(#boltGrad)" filter="url(#glowMd)"/>
      <circle cx="0" cy="0" r="8" fill="#7A3E12" opacity="0.8"/>
    </g>

    <g id="sparks" fill="#FFE24A" opacity="0.9">
      <circle cx="838" cy="196" r="5" filter="url(#glowSm)"/>
      <circle cx="870" cy="268" r="3.5" filter="url(#glowSm)"/>
      <circle cx="694" cy="140" r="4" filter="url(#glowSm)"/>
      <circle cx="246" cy="712" r="4" filter="url(#glowSm)"/>
      <circle cx="150" cy="500" r="3.5" filter="url(#glowSm)"/>
    </g>

    <g id="motes" fill="#22E8FF" opacity="0.55">
      <circle cx="120" cy="240" r="4"/>
      <circle cx="880" cy="330" r="4"/>
      <circle cx="820" cy="700" r="5"/>
      <circle cx="200" cy="820" r="4"/>
      <circle cx="700" cy="880" r="4"/>
    </g>
  </g>
</svg>
